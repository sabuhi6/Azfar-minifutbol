<!DOCTYPE html>
<html lang="az" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Minifutbol 2.1</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#14482c">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Minifutbol">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Roboto+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f3f5ee;--card:#fff;--ink:#17261d;--mute:#66756b;--line:#dbe2d5;--y:#e8b923;--b:#5f6b78;--g:#1f5c3a}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1a13;--card:#17261d;--ink:#eef3ea;--mute:#93a498;--line:#274232;--g:#3f9a68}}
:root[data-theme="dark"]{--bg:#0f1a13;--card:#17261d;--ink:#eef3ea;--mute:#93a498;--line:#274232;--g:#3f9a68}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:520px;margin:0 auto;padding:16px 16px 100px}
h1{font:700 34px/1 "Roboto Condensed",Impact,sans-serif;margin:8px 0 14px;letter-spacing:.5px}
h2{font:700 22px/1 "Roboto Condensed",Impact,sans-serif;margin:0 0 10px}
.tabs{display:flex;gap:6px;margin-bottom:16px;border-bottom:2px solid var(--line)}
.tabs button{flex:1;padding:10px;background:none;border:0;color:var(--mute);font:600 15px system-ui;border-bottom:3px solid transparent;margin-bottom:-2px}
.tabs button.on{color:var(--ink);border-color:var(--g)}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px}
input{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;min-width:0}
button{font:inherit;cursor:pointer}
.row{display:flex;gap:8px;align-items:center}
.row input{flex:1}
.btn{background:var(--g);color:#fff;border:0;border-radius:8px;padding:10px 14px;font-weight:600}
.btn.full{width:100%;margin-top:12px;padding:13px}
.ghost{background:none;border:0;color:var(--mute);font-size:13px;padding:4px 6px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.chip{border:2px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:6px 12px;font-size:14px}
.chip.A{background:var(--y);border-color:var(--y);color:#2a2000}
.chip.B{background:var(--b);border-color:var(--b);color:#fff}
.cnt{display:flex;justify-content:space-between;font-size:13px;color:var(--mute)}
.cnt b{color:var(--ink)}
.score{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:12px}
.score input{width:72px;text-align:center;font:700 34px "Roboto Condensed",Impact,sans-serif;padding:6px}
.score span{font-weight:700;color:var(--mute)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
.m-head{display:flex;justify-content:space-between;align-items:center;color:var(--mute);font-size:13px}
.m-score{display:flex;align-items:center;justify-content:center;gap:14px;font:700 40px/1 "Roboto Condensed",Impact,sans-serif;margin:8px 0}
.m-score .w{color:var(--g)}
.sides{display:grid;grid-template-columns:1fr 1fr;gap:10px;font-size:14px}
.sides div{padding-left:8px;border-left:4px solid var(--y)}
.sides div+div{border-color:var(--b)}
.sides small{display:block;color:var(--mute);margin-bottom:2px}
.wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{padding:8px 6px;text-align:center;border-bottom:1px solid var(--line)}
th{font-size:12px;color:var(--mute);font-weight:600}
td:first-child,th:first-child{text-align:left}
.empty{color:var(--mute);font-size:14px;margin:6px 0}
select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px}
.pos{font-size:11px;font-weight:700;opacity:.75;margin-left:2px}
.gkrow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px;font-size:13px;color:var(--mute)}
.gkrow select{width:100%;margin-top:4px}
.rt{margin-top:10px;font-size:14px;border-top:1px solid var(--line);padding-top:8px}
.rrow{display:flex;justify-content:space-between;align-items:center;margin:6px 0}
.pitch{background:#2e7d4f;border-radius:10px;padding:10px 6px;margin-top:8px;color:#fff}
.pitch .pt{font:700 14px "Roboto Condensed",Impact,sans-serif;text-align:center;opacity:.85;letter-spacing:.5px}
.prow{display:flex;justify-content:space-evenly;margin:10px 0}
.pl{width:30%;text-align:center;font-size:11px;line-height:1.2}
.pl i{display:flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:50%;margin:0 auto 3px;font-style:normal;font-weight:700;font-size:12px;border:2px solid #fff}
.pl i.A{background:var(--y);color:#2a2000}
.pl i.B{background:var(--b);color:#fff}
.pl span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mid{border-top:2px solid rgba(255,255,255,.55);margin:6px 0}
.lined{margin-top:12px}
.lrow{display:flex;gap:6px;margin:6px 0}
.lrow select{flex:1;min-width:0;font-size:13px;padding:7px 4px}
.lined .cnt select{padding:5px 6px;font-size:13px}
.pitch{position:relative;overflow:hidden}
.pitch>*{position:relative;z-index:1}
.pitch>.lines{position:absolute;z-index:0;inset:4px;border:2px solid rgba(255,255,255,.5);border-radius:6px}
.lines b{position:absolute;left:50%;transform:translateX(-50%);box-sizing:border-box;border:2px solid rgba(255,255,255,.5)}
.lines .pa{width:62%;height:96px}
.lines .ga{width:32%;height:52px}
.lines .t{top:-2px;border-top:0}
.lines .b{bottom:-2px;border-bottom:0}
.lines .ps{width:5px;height:5px;border:0;background:rgba(255,255,255,.85);border-radius:50%}
.lines .ps.t{top:84px}
.lines .ps.b{bottom:84px}
.lines .pr{width:52px;height:26px}
.lines .arT{top:94px;border-top:0;border-radius:0 0 26px 26px}
.lines .arB{bottom:94px;border-bottom:0;border-radius:26px 26px 0 0}
.pitch>.mid{z-index:0}
.mid i{position:absolute;left:50%;top:-28px;width:56px;height:56px;margin-left:-28px;border:2px solid rgba(255,255,255,.5);border-radius:50%}
.prow.gk{margin:10px 0 20px}
.prow.gk.r{margin:20px 0 10px}
.pl span{display:flex;justify-content:center;gap:2px;overflow:hidden}
.pl em{font-style:normal;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.pl .st{flex:none;color:#ffd54a;font-size:11px}
.plink{cursor:pointer;text-decoration:underline dotted;text-underline-offset:3px}
.pgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;text-align:center}
.pgrid b{display:block;font:700 26px/1 "Roboto Condensed",Impact,sans-serif}
.pgrid small{color:var(--mute);font-size:11px}
.form{margin-top:12px;font-size:13px;color:var(--mute);display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.res{display:inline-flex;width:24px;height:24px;border-radius:50%;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff}
.res.Q{background:var(--g)}
.res.B{background:#8a96a0}
.res.M{background:#c0392b}
.mrow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.mrow small{color:var(--mute)}
.star{color:#e8b923}
.evt{display:flex;justify-content:space-between;align-items:baseline;margin-top:10px;padding-left:8px;border-left:4px solid var(--y)}
.evt.B{border-color:var(--b)}
.evt+.evrow.evh{margin-top:2px}
.evrow{display:flex;align-items:center;gap:6px;margin:5px 0;font-size:14px}
.evrow>span:first-child{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.evh small{color:var(--mute);font-size:11px}
.stp{display:flex;align-items:center;justify-content:center;gap:4px;width:96px}
.stp button{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:18px;line-height:1;padding:0}
.stp b{min-width:18px;text-align:center}
.lb{color:var(--mute);font-size:12px;align-self:center;min-width:58px}
#fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;border:0;background:var(--g);color:#fff;font-size:30px;line-height:1;box-shadow:0 4px 14px rgba(0,0,0,.3);z-index:50;padding:0}
.av{border-radius:50%;object-fit:cover;vertical-align:middle;margin-right:8px;display:inline-block;background:var(--line)}
.av.ini{display:inline-flex;align-items:center;justify-content:center;font-weight:700;color:var(--ink)}
.phead{display:flex;align-items:center;gap:14px}
.phead .av{margin:0;flex:none}
.phead+.pgrid{margin-top:16px}

background:radial-gradient(120% 55% at 50% 0%,rgba(255,255,255,.65),transparent 70%),radial-gradient(100% 50% at 50% 100%,rgba(31,92,58,.14),transparent 70%),repeating-linear-gradient(180deg,rgba(31,92,58,.07) 0 72px,transparent 72px 144px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) body::after{background:radial-gradient(120% 55% at 50% 0%,rgba(63,154,104,.18),transparent 70%),radial-gradient(100% 50% at 50% 100%,rgba(0,0,0,.35),transparent 70%),repeating-linear-gradient(180deg,rgba(63,154,104,.07) 0 72px,transparent 72px 144px)}}
:root[data-theme="dark"] body::after{background:radial-gradient(120% 55% at 50% 0%,rgba(63,154,104,.18),transparent 70%),radial-gradient(100% 50% at 50% 100%,rgba(0,0,0,.35),transparent 70%),repeating-linear-gradient(180deg,rgba(63,154,104,.07) 0 72px,transparent 72px 144px)}
.grp{font:700 15px "Roboto Condensed",Impact,sans-serif;letter-spacing:.6px;text-transform:uppercase;color:var(--mute);margin:18px 2px 6px}
.card.list{padding:0;overflow:hidden}
.mi{display:flex;align-items:center;gap:12px;padding:10px 12px;border-top:1px solid var(--line);cursor:pointer;-webkit-tap-highlight-color:transparent}
.mi:first-child{border-top:0}
.mi:active,.mi.open{background:var(--bg)}
.mi-t{width:46px;flex:none;text-align:center;font-size:13px;color:var(--mute);border-right:1px solid var(--line);padding-right:10px;display:flex;flex-direction:column}
.mi-t small{font-size:11px;min-height:14px}
.mi-n{flex:1;min-width:0;font-size:15px;line-height:1.55}
.mi-n div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mi-s{display:flex;flex-direction:column;align-items:flex-end;font:700 18px/1.3 "Roboto Condensed",Impact,sans-serif}
.mi .w{font-weight:700}
.mi .l{color:var(--mute);font-weight:400}
.mi-s .l{font-weight:600}
.chev{color:var(--mute);font-size:20px;transition:transform .2s;width:12px;text-align:center}
.mi.open .chev{transform:rotate(90deg)}
.md{padding:4px 12px 12px;background:var(--bg);border-top:1px dashed var(--line)}
.md .m-head{margin:6px 0 10px}
.sides small.pos{display:inline;margin:0 0 0 4px}
.podium{display:flex;align-items:flex-end;gap:8px;margin:6px 0 14px}
.pod{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:0;padding:0;color:var(--ink)}
.pav{position:relative;display:inline-block}
.pav .av{margin:0;border:3px solid var(--line)}
.pav i{position:absolute;right:-4px;bottom:-2px;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font:700 13px system-ui;font-style:normal;color:#2a2000;background:#cfd6dc;border:2px solid var(--card)}
.p1 .pav .av{border-color:#e8b923}.p1 .pav i{background:#e8b923}
.p2 .pav .av{border-color:#b9c2ca}.p2 .pav i{background:#b9c2ca}
.p3 .pav .av{border-color:#c98a4b}.p3 .pav i{background:#c98a4b;color:#fff}
.pn{font-weight:600;font-size:14px;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pv{font:700 20px/1 "Roboto Condensed",Impact,sans-serif}
.pv small{font:500 11px system-ui;color:var(--mute)}
.pb{width:100%;border-radius:10px 10px 0 0;margin-top:4px;background:var(--card);border:1px solid var(--line);border-bottom:0}
.p1 .pb{height:62px;background:linear-gradient(180deg,rgba(232,185,35,.35),var(--card))}
.p2 .pb{height:42px;background:linear-gradient(180deg,rgba(185,194,202,.4),var(--card))}
.p3 .pb{height:28px;background:linear-gradient(180deg,rgba(201,138,75,.35),var(--card))}
.srow{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;background:none;border:0;border-top:1px solid var(--line);color:var(--ink);text-align:left}
.srow:first-child{border-top:0}
.srow:active{background:var(--bg)}
.srow .av{margin:0;flex:none}
.rk{width:18px;flex:none;text-align:center;font:700 15px "Roboto Condensed",Impact,sans-serif;color:var(--mute)}
.sm{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.sn{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ss{font-size:12px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:5px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:3px}
.bar b{display:block;height:100%;background:var(--g);border-radius:3px}
.sv{flex:none;display:flex;flex-direction:column;align-items:flex-end;min-width:48px;line-height:1.05}
.sv b{font:700 26px/1 "Roboto Condensed",Impact,sans-serif}
.sv small{font-size:10px;color:var(--mute)}
.sv em{font-style:normal;font-size:11px;font-weight:600;color:var(--g);margin-top:2px}
.hlp{text-align:center}
.hlp .q{display:inline-flex;width:18px;height:18px;border-radius:50%;border:1.5px solid var(--mute);align-items:center;justify-content:center;font-size:11px;font-weight:700;margin-right:4px}
.hlp .empty{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.chips .lb{min-width:0;margin-right:2px}
.chips .chip{padding:6px 11px}
.mebar{display:flex;justify-content:flex-end;margin:-4px 0 6px}
.mepill{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px 12px 4px 4px;color:var(--ink);font-size:13px}
.mepill .av{margin:0}
.mepill small{color:var(--mute);font-size:11px;border-left:1px solid var(--line);padding-left:6px}
.mecard{display:flex;align-items:center;gap:10px;padding:10px 12px}
.mecard div{flex:none;display:flex;flex-direction:column;line-height:1.2}
.mecard small{color:var(--mute);font-size:12px}
.mecard select{flex:1;min-width:0}
.mi{border-left:4px solid transparent;padding-left:10px}
.mi.rA{border-left-color:var(--y)}
.mi.rB{border-left-color:var(--b)}
.mi.rD{border-left-color:var(--line)}
.mi.rA .mi-s b.w{color:#b88a00}

/* minimalist typography */
